
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1> Student Management System </h1>

    <div id="student-container"></div>

    <h3>Add New Student</h3>

    <form action="" id="student-form">
        <p>Student Name</p>
        <input type="text" id="student-name" placeholder=" Enter student Name " required >

        <p>Email</p>
        <input type="email" id="student-email" placeholder="Enter Email" required>
    
        <p>Course</p>
        <input type="text" id="student-course" placeholder="Enter Course" required>

        <button id="add-student-btn" type="submit" >Add Student</button>

    </form>

    <script src="script.js"></script>
</body>
</html>
